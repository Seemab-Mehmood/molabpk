<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLAB Pakistan — Virtual Lab Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .font-display { font-family: 'Fraunces', serif; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        body { font-family: 'Inter', sans-serif; background-color: #0E1410; color: #E7EFE9; }
        input[type=range] { accent-color: #5EEAD4; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #2A332D; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col">

    <header class="border-b border-[#1E2620] px-6 py-4 flex items-center justify-between bg-[#0B0F0C]">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 flex-shrink-0 bg-[#13251E] p-1.5 rounded-lg border border-[#233C30] flex items-center justify-center">
                <svg viewBox="0 0 500 500" class="w-full h-full">
                    <path d="M250,30 L430,130 L430,370 L250,470 L70,370 L70,130 Z" fill="#0E1410" stroke="#1F5E48" strokeWidth="10" />
                    <path d="M250,60 L400,145 L400,355 L250,440 L100,355 L100,145 Z" fill="none" stroke="#2D8C69" strokeWidth="5" />
                    <path d="M250,90 L370,160 L250,230 L130,160 Z" fill="#0C4A34" />
                    <path d="M130,160 L250,230 L250,410 L130,340 Z" fill="#115E42" />
                    <path d="M370,160 L250,230 L250,410 L370,340 Z" fill="#064E3B" />
                </svg>
            </div>
            <div>
                <h1 class="font-display text-xl tracking-tight text-[#F2EFE6] leading-tight flex items-center gap-2">
                    MOLAB <span class="text-[#5EEAD4] font-sans font-normal text-xs tracking-wider px-2 py-0.5 bg-[#142920] rounded border border-[#224434]">PAKISTAN</span>
                </h1>
                <p class="font-mono text-[10px] tracking-widest text-[#7FA08F] uppercase mt-0.5">Mathematical Oncology Lab Pakistan </p>
            </div>
        </div>
        <div class="font-mono text-[11px] text-[#5EEAD4] bg-[#14241B] px-3 py-1 rounded border border-[#1F4632]">
            Standalone Engine v1.0 Live
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-[340px_1fr] flex-grow">
        
        <aside class="border-r border-[#1E2620] p-5 space-y-6 bg-[#0B0F0C]">
            <div>
                <label class="font-mono text-[11px] uppercase tracking-wider text-[#7FA08F] block mb-2">1 · Dynamic Model</label>
                <select id="modelSelect" class="w-full bg-[#13251E] border border-[#27392F] rounded px-3 py-2 text-xs text-[#E7EFE9] outline-none focus:border-[#5EEAD4]">
                    <option value="gompertz">Gompertz Growth Model</option>
                    <option value="logistic">Logistic Growth Model</option>
                    <option value="exponential">Exponential Growth Model</option>
                </select>
                <div id="equationDisplay" class="font-mono text-xs text-[#5EEAD4] bg-[#0E1410] p-2 rounded border border-[#1E2620] mt-2 text-center">
                    dV/dt = rV · ln(K/V)
                </div>
            </div>

            <div>
                <label class="font-mono text-[11px] uppercase tracking-wider text-[#7FA08F] block mb-2">2 · Measurement Workspace</label>
                <div class="max-h-40 overflow-y-auto border border-[#1E2620] rounded bg-[#0E1410]">
                    <table class="w-full text-[11px] font-mono">
                        <thead class="sticky top-0 bg-[#0E1410] text-[#7FA08F] border-b border-[#1E2620]">
                            <tr>
                                <th class="text-left px-3 py-1.5">t (days)</th>
                                <th class="text-left px-3 py-1.5">Volume (mm³)</th>
                                <th class="w-8"></th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            </tbody>
                    </table>
                </div>
                <div class="flex gap-2 mt-2">
                    <input id="inputT" type="number" placeholder="t" class="w-1/2 bg-[#13251E] border border-[#27392F] rounded px-2 py-1 text-xs font-mono text-[#5EEAD4]" />
                    <input id="inputV" type="number" placeholder="V" class="w-1/2 bg-[#13251E] border border-[#27392F] rounded px-2 py-1 text-xs font-mono text-[#5EEAD4]" />
                    <button onclick="addMeasurementRow()" class="px-3 py-1 text-xs rounded bg-[#1F5E48] hover:bg-[#256E54] font-medium transition">Add</button>
                </div>
            </div>

            <div>
                <label class="font-mono text-[11px] uppercase tracking-wider text-[#7FA08F] block mb-2">3 · Parameter Rails</label>
                <div id="parameterContainer" class="space-y-3">
                    </div>
            </div>

            <div class="space-y-3 pt-2">
                <div class="flex items-center gap-2 bg-[#101712] p-2 rounded border border-[#1E2620]">
                    <input type="checkbox" id="holdoutToggle" class="rounded accent-[#5EEAD4]" onchange="updateSimulation()">
                    <label Sverge class="text-[11px] text-[#C7D6CC] select-none cursor-pointer" for="holdoutToggle">
                        Apply terminal 30% holdout window
                    </label>
                </div>
                <button id="optimizeBtn" onclick="executeNelderMeadFit()" class="w-full bg-[#5EEAD4] text-[#0E1410] font-semibold rounded py-2.5 text-xs uppercase tracking-wider hover:bg-[#7FF3E1] transition shadow-md">
                    Execute Nelder-Mead Alignment
                </button>
            </div>
        </aside>

        <main class="p-6 space-y-6 flex flex-col">
            <div class="bg-[#0F1812] border border-[#1E2620] rounded-lg p-5 shadow-xl flex-grow flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 id="chartTitle" class="font-display text-xl text-[#F2EFE6]">Gompertz Growth Model Dynamics</h2>
                        <p class="text-xs text-[#7FA08F] font-mono mt-0.5">Continuous Integrator Coordinate Mapping (RK4 Engine)</p>
                    </div>
                </div>

                <div class="relative flex-grow min-h-[340px] w-full bg-[#090D0A] rounded border border-[#141C16] overflow-hidden">
                    <canvas id="canvasChart" class="absolute inset-0 w-full h-full"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-[#0F1812] border border-[#1E2620] rounded-lg p-4 shadow-md">
                    <div class="font-mono text-[10px] text-[#7FA08F] uppercase tracking-wider">RMSE (Fit)</div>
                    <div id="metricRMSE" class="font-display text-2xl mt-1 text-[#5EEAD4] font-semibold">—</div>
                </div>
                <div class="bg-[#0F1812] border border-[#1E2620] rounded-lg p-4 shadow-md">
                    <div class="font-mono text-[10px] text-[#7FA08F] uppercase tracking-wider">R² (Coefficient)</div>
                    <div id="metricR2" class="font-display text-2xl mt-1 text-[#5EEAD4] font-semibold">—</div>
                </div>
                <div class="bg-[#0F1812] border border-[#1E2620] rounded-lg p-4 shadow-md">
                    <div class="font-mono text-[10px] text-[#7FA08F] uppercase tracking-wider">AIC (Criterion)</div>
                    <div id="metricAIC" class="font-display text-2xl mt-1 text-[#5EEAD4] font-semibold">—</div>
                </div>
                <div class="bg-[#0F1812] border border-[#1E2620] rounded-lg p-4 shadow-md">
                    <div class="font-mono text-[10px] text-[#7FA08F] uppercase tracking-wider">Holdout RMSE</div>
                    <div id="metricHoldout" class="font-display text-2xl mt-1 text-[#5EEAD4] font-semibold">—</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Mathematical Models Registry Base
        const MODELS = {
            gompertz: {
                name: "Gompertz Growth Model",
                eq: "dV/dt = rV · ln(K/V)",
                params: [
                    { key: "r", label: "growth rate r", def: 0.06, min: 0.001, max: 0.3 },
                    { key: "K", label: "carrying capacity K", def: 1500, min: 100, max: 3000 }
                ],
                deriv: (t, V, p) => [p.r * Math.max(V[0], 1e-5) * Math.log(p.K / Math.max(V[0], 1e-5))]
            },
            logistic: {
                name: "Logistic Growth Model",
                eq: "dV/dt = rV(1 - V/K)",
                params: [
                    { key: "r", label: "growth rate r", def: 0.08, min: 0.001, max: 0.4 },
                    { key: "K", label: "carrying capacity K", def: 1500, min: 100, max: 3000 }
                ],
                deriv: (t, V, p) => [p.r * Math.max(V[0], 0) * (1 - V[0] / p.K)]
            },
            exponential: {
                name: "Exponential Growth Model",
                eq: "dV/dt = rV",
                params: [
                    { key: "r", label: "growth rate r", def: 0.03, min: 0.001, max: 0.15 }
                ],
                deriv: (t, V, p) => [p.r * Math.max(V[0], 0)]
            }
        };

        // Experimental Timeline Default Baseline Dataset Configuration
        let dataset = [
            { t: 0, v: 95 }, { t: 7, v: 140 }, { t: 14, v: 210 }, { t: 21, v: 320 },
            { t: 28, v: 460 }, { t: 35, v: 640 }, { t: 42, v: 810 }, { t: 49, v: 980 },
            { t: 56, v: 1120 }, { t: 63, v: 1230 }, { t: 70, v: 1310 }, { t: 77, v: 1370 }
        ];

        let activeModelKey = "gompertz";
        let activeParams = {};

        // Runge-Kutta 4th Order Deterministic Engine Setup
        function rungeKutta4(deriv, y0, t0, tEnd, steps, p) {
            let dt = (tEnd - t0) / steps;
            let trajectory = [];
            let t = t0;
            let y = [...y0];
            trajectory.push({ t: t, v: y[0] });

            for (let i = 0; i < steps; i++) {
                let k1 = deriv(t, y, p);
                let yk2 = y.map((val, idx) => val + 0.5 * dt * k1[idx]);
                let k2 = deriv(t + 0.5 * dt, yk2, p);
                let yk3 = y.map((val, idx) => val + 0.5 * dt * k2[idx]);
                let k3 = deriv(t + 0.5 * dt, yk3, p);
                let yk4 = y.map((val, idx) => val + dt * k3[idx]);
                let k4 = deriv(t + dt, yk4, p);

                y = y.map((val, idx) => val + (dt / 6) * (k1[idx] + 2 * k2[idx] + 2 * k3[idx] + k4[idx]));
                t += dt;
                trajectory.push({ t: t, v: y[0] });
            }
            return trajectory;
        }

        function interpolateTrajectoryValue(trajectory, targetT) {
            if (targetT <= trajectory[0].t) return trajectory[0].v;
            if (targetT >= trajectory[trajectory.length - 1].t) return trajectory[trajectory.length - 1].v;
            for (let i = 1; i < trajectory.length; i++) {
                if (trajectory[i].t >= targetT) {
                    let p1 = trajectory[i - 1];
                    let p2 = trajectory[i];
                    let ratio = (targetT - p1.t) / (p2.t - p1.t);
                    return p1.v + ratio * (p2.v - p1.v);
                }
            }
            return 0;
        }

        // Simplex Optimization Loop Construction (Nelder-Mead Direct Optimization Search)
        function executeNelderMeadFit() {
            const currentModel = MODELS[activeModelKey];
            const trainingSubset = document.getElementById("holdoutToggle").checked 
                ? dataset.slice(0, Math.ceil(dataset.length * 0.7)) 
                : dataset;

            if(trainingSubset.length === 0) return;

            let parametersToOptim = currentModel.params.map(p => p.key);
            let initialGuess = currentModel.params.map(p => activeParams[p.key]);

            function computeObjectiveError(vector) {
                let pMapped = {};
                parametersToOptim.forEach((key, idx) => {
                    pMapped[key] = Math.max(vector[idx], 1e-6); 
                });
                let tMax = Math.max(...dataset.map(d => d.t), 10) * 1.05;
                let path = rungeKutta4(currentModel.deriv, [dataset[0].v], 0, tMax, 150, pMapped);
                
                let squareSum = 0;
                trainingSubset.forEach(pt => {
                    let pred = interpolateTrajectoryValue(path, pt.t);
                    squareSum += Math.pow(pred - pt.v, 2);
                });
                return squareSum;
            }

            // Simple Local Simplex Construction Setup
            let dim = initialGuess.length;
            let simplex = [initialGuess.slice()];
            for(let i=0; i<dim; i++) {
                let vertex = initialGuess.slice();
                vertex[i] = vertex[i] !== 0 ? vertex[i] * 1.15 : 0.05;
                simplex.push(vertex);
            }

            // Execute 150 search iterations
            for(let iter=0; iter<150; iter++) {
                simplex.sort((a, b) => computeObjectiveError(a) - computeObjectiveError(b));
                let centroid = new Array(dim).fill(0);
                for(let i=0; i<dim; i++) {
                    for(let j=0; j<dim; j++) centroid[j] += simplex[i][j] / dim;
                }
                let worst = simplex[dim];
                let reflected = centroid.map((c, idx) => c + 1.0 * (c - worst[idx]));
                if(computeObjectiveError(reflected) < computeObjectiveError(simplex[0])) {
                    simplex[dim] = reflected;
                } else {
                    simplex[dim] = centroid.map((c, idx) => c + 0.5 * (worst[idx] - c));
                }
            }

            simplex.sort((a, b) => computeObjectiveError(a) - computeObjectiveError(b));
            parametersToOptim.forEach((key, idx) => {
                let paramMeta = currentModel.params.find(p => p.key === key);
                activeParams[key] = Math.min(Math.max(simplex[0][idx], paramMeta.min), paramMeta.max);
            });

            buildParameterRails();
            updateSimulation();
        }

        // Framework System Control Matrix Architecture Mapping
        function initSetupFramework() {
            const modelSelect = document.getElementById("modelSelect");
            modelSelect.addEventListener("change", (e) => {
                activeModelKey = e.target.value;
                document.getElementById("equationDisplay").innerText = MODELS[activeModelKey].eq;
                document.getElementById("chartTitle").innerText = MODELS[activeModelKey].name;
                setDefaultParameters();
                buildParameterRails();
                updateSimulation();
            });

            setDefaultParameters();
            buildParameterRails();
            renderDataTable();
            updateSimulation();
            window.addEventListener('resize', () => drawChartCanvas());
        }

        function setDefaultParameters() {
            activeParams = {};
            MODELS[activeModelKey].params.forEach(p => {
                activeParams[p.key] = p.def;
            });
        }

        function buildParameterRails() {
            const container = document.getElementById("parameterContainer");
            container.innerHTML = "";
            MODELS[activeModelKey].params.forEach(p => {
                let wrapper = document.createElement("div");
                wrapper.className = "bg-[#0E1410] p-2 rounded border border-[#1E2620]";
                wrapper.innerHTML = `
                    <div class="flex justify-between text-[11px] mb-1">
                        <span class="text-[#C7D6CC]">${p.label}</span>
                        <span class="font-mono text-[#5EEAD4] font-semibold" id="val_${p.key}">${activeParams[p.key].toFixed(4)}</span>
                    </div>
                    <input type="range" min="${p.min}" max="${p.max}" step="${(p.max - p.min)/200}" value="${activeParams[p.key]}" class="w-full cursor-pointer" id="slide_${p.key}">
                `;
                container.appendChild(wrapper);

                document.getElementById(`slide_${p.key}`).addEventListener("input", (e) => {
                    activeParams[p.key] = parseFloat(e.target.value);
                    document.getElementById(`val_${p.key}`).innerText = activeParams[p.key].toFixed(4);
                    updateSimulation();
                });
            });
        }

        function renderDataTable() {
            const tbody = document.getElementById("dataTableBody");
            tbody.innerHTML = "";
            dataset.forEach((row, idx) => {
                let tr = document.createElement("tr");
                tr.className = "border-t border-[#1E2620] hover:bg-[#13251E]";
                tr.innerHTML = `
                    <td class="px-3 py-1">${row.t}</td>
                    <td class="px-3 py-1">${row.v}</td>
                    <td class="text-right px-2"><button onclick="removeMeasurementRow(${idx})" class="text-[#E15B64] hover:underline px-1">×</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addMeasurementRow() {
            let t = parseFloat(document.getElementById("inputT").value);
            let v = parseFloat(document.getElementById("inputV").value);
            if (!isNaN(t) && !isNaN(v)) {
                dataset.push({ t, v });
                dataset.sort((a, b) => a.t - b.t);
                document.getElementById("inputT").value = "";
                document.getElementById("inputV").value = "";
                renderDataTable();
                updateSimulation();
            }
        }

        function removeMeasurementRow(idx) {
            dataset.splice(idx, 1);
            renderDataTable();
            updateSimulation();
        }

        let computedTrajectory = [];
        function updateSimulation() {
            if (dataset.length === 0) return;
            let tMax = Math.max(...dataset.map(d => d.t), 10) * 1.05;
            computedTrajectory = rungeKutta4(MODELS[activeModelKey].deriv, [dataset[0].v], 0, tMax, 200, activeParams);
            calculateMetricsAndOutputs(computedTrajectory);
            drawChartCanvas();
        }

        // Statistical Metric Verification Pipeline
        function calculateMetricsAndOutputs(trajectory) {
            const applyHoldout = document.getElementById("holdoutToggle").checked;
            const separationBoundary = Math.ceil(dataset.length * 0.7);
            
            const trainingData = applyHoldout ? dataset.slice(0, separationBoundary) : dataset;
            const holdoutData = applyHoldout ? dataset.slice(separationBoundary) : [];

            // Calculate Training Residuals
            let sumSquareErrors = 0;
            trainingData.forEach(pt => {
                let prediction = interpolateTrajectoryValue(trajectory, pt.t);
                sumSquareErrors += Math.pow(prediction - pt.v, 2);
            });

            let meanValue = trainingData.reduce((acc, current) => acc + current.v, 0) / trainingData.length;
            let residualSumSquares = 0;
            let totalSumSquares = 0;
            trainingData.forEach(pt => {
                let prediction = interpolateTrajectoryValue(trajectory, pt.t);
                residualSumSquares += Math.pow(pt.v - prediction, 2);
                totalSumSquares += Math.pow(pt.v - meanValue, 2);
            });

            let rmseVal = Math.sqrt(residualSumSquares / trainingData.length);
            let r2Val = totalSumSquares > 0 ? (1 - (residualSumSquares / totalSumSquares)) : 1;
            let paramCount = MODELS[activeModelKey].params.length;
            let aicVal = trainingData.length * Math.log(Math.max(residualSumSquares / trainingData.length, 1e-10)) + 2 * paramCount;

            document.getElementById("metricRMSE").innerText = rmseVal.toFixed(2);
            document.getElementById("metricR2").innerText = r2Val.toFixed(3);
            document.getElementById("metricAIC").innerText = aicVal.toFixed(1);

            // Compute Holdout validation spread
            if (applyHoldout && holdoutData.length > 0) {
                let holdoutResiduals = 0;
                holdoutData.forEach(pt => {
                    let pred = interpolateTrajectoryValue(trajectory, pt.t);
                    holdoutResiduals += Math.pow(pt.v - pred, 2);
                });
                let holdoutRmse = Math.sqrt(holdoutResiduals / holdoutData.length);
                document.getElementById("metricHoldout").innerText = holdoutRmse.toFixed(2);
            } else {
                document.getElementById("metricHoldout").innerText = "—";
            }
        }

        // Complete Canvas Graphic Context Generation System
        function drawChartCanvas() {
            const canvas = document.getElementById("canvasChart");
            const ctx = canvas.getContext("2d");
            
            // Sync pixel dimensions
            const dpr = window.devicePixelRatio || 1;
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            if (dataset.length === 0 || computedTrajectory.length === 0) return;

            // Coordinate Boundaries mapping limits
            const paddingLeft = 55;
            const paddingRight = 30;
            const paddingTop = 20;
            const paddingBottom = 40;
            
            const renderWidth = width - paddingLeft - paddingRight;
            const renderHeight = height - paddingTop - paddingBottom;

            let maxT = computedTrajectory[computedTrajectory.length - 1].t;
            let maxV = Math.max(...dataset.map(d => d.v), ...computedTrajectory.map(c => c.v)) * 1.1;

            function mapToCanvasCoords(t, v) {
                let x = paddingLeft + (t / maxT) * renderWidth;
                let y = paddingTop + renderHeight - (v / maxV) * renderHeight;
                return { x, y };
            }

            // Clean background canvas matrix
            ctx.fillStyle = "#090D0A";
            ctx.fillRect(0, 0, width, height);

            // Draw Holdout Shading Segment
            const applyHoldout = document.getElementById("holdoutToggle").checked;
            const separationBoundary = Math.ceil(dataset.length * 0.7);
            if (applyHoldout && dataset[separationBoundary - 1]) {
                let splitT = dataset[separationBoundary - 1].t;
                let startX = mapToCanvasCoords(splitT, 0).x;
                ctx.fillStyle = "rgba(225, 91, 100, 0.05)";
                ctx.fillRect(startX, paddingTop, (width - paddingRight) - startX, renderHeight);
                
                ctx.strokeStyle = "rgba(225, 91, 100, 0.2)";
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(startX, paddingTop);
                ctx.lineTo(startX, paddingTop + renderHeight);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Cartesian Grid Lines
            ctx.strokeStyle = "#1E2620";
            ctx.lineWidth = 1;
            
            // Horizontal lines
            for (let i = 0; i <= 4; i++) {
                let valV = (maxV / 4) * i;
                let coords = mapToCanvasCoords(0, valV);
                ctx.beginPath();
                ctx.moveTo(paddingLeft, coords.y);
                ctx.lineTo(width - paddingRight, coords.y);
                ctx.stroke();

                ctx.fillStyle = "#7FA08F";
                ctx.font = "10px 'IBM Plex Mono'";
                ctx.fillText(Math.round(valV), 10, coords.y + 4);
            }

            // Vertical axis markers
            for (let i = 0; i <= 5; i++) {
                let valT = (maxT / 5) * i;
                let coords = mapToCanvasCoords(valT, 0);
                ctx.beginPath();
                ctx.moveTo(coords.x, paddingTop);
                ctx.lineTo(coords.x, height - paddingBottom);
                ctx.stroke();

                ctx.fillStyle = "#7FA08F";
                ctx.font = "10px 'IBM Plex Mono'";
                ctx.fillText(valT.toFixed(0), coords.x - 6, height - paddingBottom + 16);
            }

            // Plot continuous RK4 simulation trace
            ctx.strokeStyle = "#5EEAD4";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            computedTrajectory.forEach((pt, idx) => {
                let coords = mapToCanvasCoords(pt.t, pt.v);
                if (idx === 0) ctx.moveTo(coords.x, coords.y);
                else ctx.lineTo(coords.x, coords.y);
            });
            ctx.stroke();

            // Plot Experimental Points
            dataset.forEach((pt, idx) => {
                let coords = mapToCanvasCoords(pt.t, pt.v);
                let isHoldout = applyHoldout && idx >= separationBoundary;
                
                ctx.fillStyle = isHoldout ? "#E15B64" : "#F5B544";
                ctx.beginPath();
                ctx.arc(coords.x, coords.y, 4, 0, 2 * Math.PI);
                ctx.fill();
                
                ctx.strokeStyle = "#0E1410";
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }

        // Initialize execution matrix on page launch window
        window.onload = initSetupFramework;
    </script>
</body>
</html>
